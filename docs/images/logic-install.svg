<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 760" width="700" height="760" role="img" aria-label="Lệnh install làm gì trên mỗi node">
<title>Lệnh install làm gì trên mỗi node</title>
<defs><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker><marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><radialGradient id="gl-orange"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><radialGradient id="gl-blue"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="gl-green"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient><radialGradient id="gl-purple"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><radialGradient id="gl-pink"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient><radialGradient id="gl-slate"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#94a3b8"/><stop offset="1" stop-color="#94a3b8" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#162033"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<style>
text { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
.t1 { fill: #f1f5f9; font-size: 15px; font-weight: 600; }
.t2 { fill: #94a3b8; font-size: 12px; }
.lb { fill: #cbd5e1; font-size: 11.5px; font-weight: 600; }
.gt { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
.flow { fill: none; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 0.9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -13; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
</style>
<rect width="700" height="760" rx="14" fill="#0f172a"/>
<g filter="url(#sh)"><rect x="240.0" y="24" width="240" height="62" rx="10" fill="url(#card)" stroke="#f59e0b" stroke-width="1.6"/><rect x="240.0" y="34" width="4" height="42" rx="2" fill="#f59e0b"/></g><text class="t1" x="360.0" y="51.0" text-anchor="middle">Copy CustomNetworkMetrics.pm</text><text class="t2" x="360.0" y="70.0" text-anchor="middle">kiểm tra cú pháp perl -c</text><g filter="url(#sh)"><rect x="240.0" y="120" width="240" height="62" rx="10" fill="url(#card)" stroke="#38bdf8" stroke-width="1.6"/><rect x="240.0" y="130" width="4" height="42" rx="2" fill="#38bdf8"/></g><text class="t1" x="360.0" y="147.0" text-anchor="middle">Cài module</text><text class="t2" x="360.0" y="166.0" text-anchor="middle">/usr/share/perl5/PVE/</text><g filter="url(#sh)"><path d="M360,214.0 L475.0,262 L360,310.0 L245.0,262 Z" fill="url(#card)" stroke="#a78bfa" stroke-width="1.6"/></g><text class="t1" x="360" y="259" text-anchor="middle">InfluxDB.pm</text><text class="t2" x="360" y="277" text-anchor="middle">đã được patch?</text><g filter="url(#sh)"><rect x="240.0" y="348" width="240" height="62" rx="10" fill="url(#card)" stroke="#38bdf8" stroke-width="1.6"/><rect x="240.0" y="358" width="4" height="42" rx="2" fill="#38bdf8"/></g><text class="t1" x="360.0" y="375.0" text-anchor="middle">Backup InfluxDB.pm.bak</text><text class="t2" x="360.0" y="394.0" text-anchor="middle">chỉ làm lần đầu</text><g filter="url(#sh)"><path d="M360,442.0 L475.0,490 L360,538.0 L245.0,490 Z" fill="url(#card)" stroke="#a78bfa" stroke-width="1.6"/></g><text class="t1" x="360" y="487" text-anchor="middle">Bản patch</text><text class="t2" x="360" y="505" text-anchor="middle">qua perl -c?</text><g filter="url(#sh)"><rect x="240.0" y="576" width="240" height="62" rx="10" fill="url(#card)" stroke="#38bdf8" stroke-width="1.6"/><rect x="240.0" y="586" width="4" height="42" rx="2" fill="#38bdf8"/></g><text class="t1" x="360.0" y="612.0" text-anchor="middle">Ghi InfluxDB.pm đã patch</text><g filter="url(#sh)"><rect x="240.0" y="672" width="240" height="62" rx="10" fill="url(#card)" stroke="#34d399" stroke-width="1.6"/><rect x="240.0" y="682" width="4" height="42" rx="2" fill="#34d399"/></g><text class="t1" x="360.0" y="699.0" text-anchor="middle">Restart pvestatd + tự check</text><text class="t2" x="360.0" y="718.0" text-anchor="middle">module, patch, ethtool, số liệu card</text><g filter="url(#sh)"><rect x="20" y="459" width="170" height="62" rx="10" fill="url(#card)" stroke="#f472b6" stroke-width="1.6"/><rect x="20" y="469" width="4" height="42" rx="2" fill="#f472b6"/></g><text class="t1" x="105.0" y="486.0" text-anchor="middle">Không ghi đè</text><text class="t2" x="105.0" y="505.0" text-anchor="middle">node giữ nguyên, báo LOI</text><path id="p1" d="M360,86 L360,118" class="flow" stroke="#f59e0b" marker-end="url(#ar-orange)"/><circle r="5.5" fill="url(#gl-orange)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p1"/></animateMotion></circle><path id="p2" d="M360,182 L360,212" class="flow" stroke="#38bdf8" marker-end="url(#ar-blue)"/><circle r="5.5" fill="url(#gl-blue)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p2"/></animateMotion></circle><path id="p3" d="M360,310 L360,346" class="flow" stroke="#a78bfa" marker-end="url(#ar-purple)"/><circle r="5.5" fill="url(#gl-purple)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p3"/></animateMotion></circle><rect x="377.8" y="317" width="40.4" height="20" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.6"/><text class="lb" x="398" y="331.5" text-anchor="middle">Chưa</text><path id="p4" d="M360,410 L360,440" class="flow" stroke="#38bdf8" marker-end="url(#ar-blue)"/><circle r="5.5" fill="url(#gl-blue)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p4"/></animateMotion></circle><path id="p5" d="M360,538 L360,574" class="flow" stroke="#34d399" marker-end="url(#ar-green)"/><circle r="5.5" fill="url(#gl-green)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p5"/></animateMotion></circle><rect x="376.4" y="545" width="27.2" height="20" rx="10" fill="#0f172a" stroke="#34d399" stroke-opacity="0.6"/><text class="lb" x="390" y="559.5" text-anchor="middle">OK</text><path id="p6" d="M360,638 L360,670" class="flow" stroke="#38bdf8" marker-end="url(#ar-blue)"/><circle r="5.5" fill="url(#gl-blue)"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p6"/></animateMotion></circle><path id="p7" d="M245,490 L192,490" class="flow" stroke="#f472b6" marker-end="url(#ar-pink)"/><circle r="5.5" fill="url(#gl-pink)"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p7"/></animateMotion></circle><rect x="203.1" y="461" width="33.8" height="20" rx="10" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.6"/><text class="lb" x="220" y="475.5" text-anchor="middle">Lỗi</text><path id="p8" d="M475,262 L640,262 L640,703 L482.0,703" class="flow" stroke="#94a3b8" marker-end="url(#ar-slate)"/><circle r="5.5" fill="url(#gl-slate)"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.00s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p8"/></animateMotion></circle><rect x="593.4" y="229" width="93.19999999999999" height="20" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-opacity="0.6"/><text class="lb" x="640" y="243.5" text-anchor="middle">Rồi — bỏ qua</text></svg>
