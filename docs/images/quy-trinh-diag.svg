<style>
text { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
.t1 { fill: #f1f5f9; font-size: 15px; font-weight: 600; }
.t2 { fill: #94a3b8; font-size: 12px; }
.lb { fill: #cbd5e1; font-size: 11.5px; font-weight: 600; }
.gt { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
.flow { fill: none; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 0.9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -13; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
</style>
<rect width="998" height="150" rx="14" fill="#0f172a"/>
