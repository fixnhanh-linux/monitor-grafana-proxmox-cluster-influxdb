 rx="2" fill="#34d399"/></g><text class="t1" x="919.0" y="71.0" text-anchor="middle">Kết luận</text><text class="t2" x="919.0" y="90.0" text-anchor="middle">lỗi ở đâu</text><path id="track" d="M30,128 L968,128" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/><circle r="7" fill="url(#gl-green)"><animateMotion dur="6.3s" repeatCount="indefinite"><mpath xlink:href="#track"/></animateMotion></circle></svg>
